name: Update stock data

on:
  schedule:
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stock prices
        run: |
          python3 - <<'EOF'
          import json, sys, time, urllib.request

          # Stocks shown in the bar graph. Left = name on the page, right = Yahoo Finance symbol.
          STOCKS = [
              ("MSTR", "MSTR"),
              ("ASST", "ASST"),
              ("MTPLF", "MTPLF"),
              ("CRCL", "CRCL"),
              ("COIN", "COIN"),
          ]
          PERIODS = [1, 7, 30, 182, 365]


          def fetch(symbol):
              url = "https://query1.finance.yahoo.com/v8/finance/chart/%s?range=2y&interval=1d" % symbol
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)


          def build(name, data):
              res = data["chart"]["result"][0]
              closes = res["indicators"]["quote"][0]["close"]
              pts = [(t, c) for t, c in zip(res["timestamp"], closes) if c is not None]
              price = res.get("meta", {}).get("regularMarketPrice") or pts[-1][1]
              last_t = pts[-1][0]
              changes, diffs = {}, {}
              for days in PERIODS:
                  if days == 1:
                      ref = pts[-2][1] if len(pts) > 1 else None
                  else:
                      older = [c for t, c in pts if t <= last_t - days * 86400]
                      ref = older[-1] if older else None
                  if ref:
                      changes[str(days)] = round((price / ref - 1) * 100, 2)
                      diffs[str(days)] = round(price - ref, 4)
              return {"name": name, "price": round(price, 4), "changes": changes, "diffs": diffs}


          def main():
              out = []
              for name, symbol in STOCKS:
                  try:
                      out.append(build(name, fetch(symbol)))
                  except Exception as e:
                      print("FAILED %s: %s" % (symbol, e))
                  time.sleep(1)
              if not out:
                  print("No stock data fetched. Keeping the old file.")
                  sys.exit(1)
              stamp = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              with open("stocks.json", "w") as f:
                  json.dump({"updated": stamp, "stocks": out}, f, indent=1)
              print("Saved %d stocks at %s" % (len(out), stamp))


          if __name__ == "__main__":
              main()
          EOF

      - name: Save stocks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.json
          git diff --cached --quiet || git commit -m "Update stock data"
          git push
